name: Release

# A tag is the ONLY trigger. Everything the release needs is verified here,
# on the tagged commit itself — the workflow does not poll `ci.yml` and does
# not depend on CI having run on `main` first.
on:
  push:
    tags:
      - 'v*'

# Two tags pushed in quick succession must not publish concurrently. The
# group is per-tag, and an in-flight release is never cancelled midway — a
# half-published release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Build + test on the tagged commit, and refuse a tag that disagrees with
  # package.json. This runs BEFORE anything is created, so a mismatch costs
  # nothing to undo: no GitHub Release, no tag surgery.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 to match the helper module's zstd API surface; see
          # .github/workflows/ci.yml for the rationale.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # An explicit cache with `restore-keys` rather than setup-node's
      # `cache: npm`: `npm version` rewrites package-lock.json on every
      # release, so a strict lockfile key always cold-installed.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json ✓"

  # GitHub Release notes come from CHANGELOG.md. `query` fails the job when
  # the version section is missing, which is the intended outcome: a release
  # with empty notes is worse than no release.
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.release-notes }}
          draft: false

  # This fork does NOT publish to npm, and cannot: package.json is named
  # `dsh-wechat`, but that bare npm name belongs to the upstream project
  # (pan17/dsh-wechat) — see the README's "本仓不发布 npm 包" note. This job is
  # kept as an explicit, documented no-op so the tag-triggered release can go
  # green; if this fork ever ships its own package it must be published under a
  # name we own (e.g. a `@perrylink/` scope), not the upstream bare name.
  npm-publish-disabled:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why no npm publish happens
        run: |
          echo "Skipping npm publish on purpose."
          echo "package.json is named 'dsh-wechat', but that npm name is owned by"
          echo "the upstream project (pan17/dsh-wechat); this fork does not own it"
          echo "and the README states this repository does not publish to npm."
          echo "See CHANGELOG for the 2026-09-10 note."
