name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Hard CI gate. When `git push origin main --tags` fires both CI and
  # Release in parallel, this job polls the CI workflow run for the
  # tag's commit until it settles on `success`. Both downstream jobs
  # (`release`, `npm-publish-disabled`) `needs: ci-green`, so a red CI
  # blocks the GitHub Release creation — it cannot fire alone. Polls up
  # to ~5 minutes (CI itself runs ~15s, the slack absorbs the
  # parallel-release runner queue).
  ci-green:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on this commit to be green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$GITHUB_SHA"
          echo "Checking CI conclusion for $SHA..."
          for i in $(seq 1 60); do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | select(.name=="CI") | "\(.conclusion)\t\(.status)"' | head -1)
            case "$CONCLUSION" in
              "success	completed")
                echo "CI is green ✓"; exit 0 ;;
              "failure	completed"|"cancelled	completed"|"timed_out	completed")
                echo "::error::CI conclusion '$CONCLUSION' — blocking entire release"
                exit 1 ;;
              *)
                echo "Attempt $i/60 — CI status: '${CONCLUSION:-pending}' (sleeping 5s)"
                sleep 5 ;;
            esac
          done
          echo "::error::Timed out waiting for CI to settle on $SHA"
          exit 1

  # GitHub Release: created only after `ci-green` succeeds. The
  # changelog query validates the release notes (fail fast if the
  # version section is missing).
  release:
    needs: ci-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.release-notes }}
          draft: false

  # This repository does NOT publish to npm, and cannot: package.json is named
  # `dsh-wechat`, but that bare npm name belongs to the upstream project
  # (maintainer panpan2026, repository pan17/dsh-wechat) — see the README's
  # "本仓不发布 npm 包" note. The previous implementation ran
  # `npm publish` with `secrets.DSH_WECHAT`; every release failed with
  # `npm error code ENEEDAUTH` (the secret is unset) and would have failed with
  # 403 even if it were set, because we do not own the name. The job is kept as
  # an explicit, documented no-op so the tag-triggered release can go green; if
  # this fork ever ships its own package it must be published under a name we
  # own (e.g. a `@perrylink/` scope), not the upstream bare name.
  npm-publish-disabled:
    needs: ci-green
    runs-on: ubuntu-latest
    steps:
      - name: Explain why no npm publish happens
        run: |
          echo "Skipping npm publish on purpose."
          echo "package.json is named 'dsh-wechat', but that npm name is owned by"
          echo "the upstream project (pan17/dsh-wechat); this fork does not own it"
          echo "and the README states this repository does not publish to npm."
          echo "See CHANGELOG for the 2026-09-10 note."
