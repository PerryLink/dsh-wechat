name: CI

# Run on EVERY branch push, not only `main`.
#
# Why: the previous filter was `push: branches: [main]`, so pushing a feature
# branch produced no CI run at all. A PR whose head was such a branch shipped an
# assertion that only holds on Windows (`C:\home\.dsh` compared against a path
# the implementation runs through `path.resolve` — on POSIX that literal is
# relative and resolves under the cwd, so the assertion is never true). It was
# green on the author's machine, never seen by CI, and surfaced only on the next
# push to main — where the `ci-green` gate in release.yml then blocked the
# release. Running CI on every branch means a PR branch is validated before the
# PR is opened, instead of after it is merged.
#
# This also keeps release.yml's `ci-green` job honest: it looks for a CI run on
# the tagged SHA, which now always exists.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin Node 22 — the helper module relies on `zlib.zstdDecompressSync`
          # (Stable in 22.x / Experimental in 23+/24) to read DSH's
          # session.jsonl.zstd artifacts. GitHub-hosted runners default to
          # Node 24 now and that build does not ship the Zstd API surface.
          node-version: 22
      # Explicit cache + `restore-keys`, matching release.yml. setup-node's
      # `cache: npm` keys strictly on `hashFiles(lockfile)`, so any lockfile
      # edit — a version bump is enough — forces a cold install. The prefix
      # fallback keeps a key change to a partial hit.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - run: npm test
